[tool.poetry]
name = "mock-alchemy"
version = "0.3.0"
description = "SQLAlchemy mock helpers."
license = "MIT"
homepage = "https://github.com/rajivsarvepalli/mock-alchemy"
repository = "https://github.com/rajivsarvepalli/mock-alchemy"
authors = ["Rajiv Sarvepalli <rajiv@sarvepalli.net>", "Miroslav Shubernetskiy <mail@miki725.com>", "Serkan Hoscai <serkan@hosca.com"]
readme = "READMEPYPI.md"
keywords = ["sqlalchemy mock testing", "sqlalchemy mock", "mock sqlalchemy"]
documentation = "https://mock-alchemy.readthedocs.io"
classifiers=[
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 2 - Pre-Alpha",
]

[tool.poetry.urls]
Changelog = "https://github.com/rajivsarvepalli/mock-alchemy/releases"

[tool.poetry.dependencies]
packaging = "^26.4"
python = "^3.10"
SQLAlchemy = "^2.0.6"


[tool.poetry.dev-dependencies]
pytest = {version = "^9.2.0", python = ">=3.11"}
coverage = {extras = ["toml"], version = "^7.17.5", python = ">=3.11"}
pytest-cov = {version = "^7.1.0", python = ">=3.11"}
black = {version = "^26.10.1", python = ">=3.11"}
flake8 = {version = "^7.5.0", python = ">=3.11"}
flake8-bandit = {version = "^4.1.1", python = ">=3.11"}
flake8-bugbear = {version = "^26.11.22", python = ">=3.11"}
flake8-import-order = {version = "^0.19.2", python = ">=3.11"}
mypy = {version = "^2.4.1", python = ">=3.11"}
typeguard = {version = "^4.6.1", python = ">=3.11"}
flake8-annotations = {version = "^3.3.1", python = ">=3.11"}
flake8-docstrings = {version = "^1.7.0", python = ">=3.11"}
darglint = {version = "^1.8.1", python = ">=3.11"}
xdoctest = {version = "^1.3.2", python = ">=3.11"}
Sphinx = {version = "9.0.4", python = ">=3.11"}
pydata-sphinx-theme = {version = "^0.24.0", python = ">=3.11"}
sphinx-copybutton = {version = "^0.5.2", python = ">=3.11"}
pep8-naming = {version = "^0.15.1", python = ">=3.11"}
Pygments = {version = "^2.21.0", python = ">=3.11"}
sphinx-autodoc-typehints = {version = "==3.6.1", python = ">=3.11"}
flake8-rst-docstrings = {version = "^0.4.0", python = ">=3.11"}
pre-commit = {version = "^4.7.0", python = ">=3.11"}
pre-commit-hooks = {version = "^6.0.0", python = ">=3.11"}
isort = {version = "^9.0.2", python = ">=3.11"}
setuptools = {version = "^84.1.0", python = ">=3.11"}
filelock = {version = "^4.3.1", python = ">=3.11"}
soupsieve = {version = "^2.9.1", python = ">=3.11"}
virtualenv = {version = "^21.14.9", python = ">=3.11"}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["mock_alchemy"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.isort]
src_paths = ["src", "test"]
force_single_line = true
